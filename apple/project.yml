# XcodeGen spec for the Apple clients; `make apple-project` generates
# LeafPDF.xcodeproj from it. Edit this file, never the generated project.
name: LeafPDF
options:
  bundleIdPrefix: com.timhilt
  deploymentTarget:
    iOS: "26.0"
    macOS: "27.0"
packages:
  LeafCore:
    path: LeafCore
targets:
  # One multiplatform target serves iOS, iPadOS and macOS.
  LeafPDF:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [LeafPDF]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: LeafCore
    # The formats LeafPDF opens from outside (share sheet, Open With, Dock).
    # Alternate: never the default handler. Add MOBI here.
    info:
      path: Config/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: EPUB Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
        # Cloud Provider OAuth: client IDs and redirect schemes come from
        # Config/CloudClients.xcconfig (scripts/cloud-oauth-wizard.sh).
        CFBundleURLTypes:
          - CFBundleURLName: Google Drive sign-in
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [$(GOOGLE_REDIRECT_SCHEME)]
          - CFBundleURLName: OneDrive sign-in
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [$(MICROSOFT_REDIRECT_SCHEME)]
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        GoogleRedirectScheme: $(GOOGLE_REDIRECT_SCHEME)
        MicrosoftClientID: $(MICROSOFT_CLIENT_ID)
        MicrosoftRedirectScheme: $(MICROSOFT_REDIRECT_SCHEME)
        # One window per Device, all Tabs in it (docs/adr/0018); iPadOS gets one scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timhilt.leafpdf
        # Automatic signing with the team from Config/Local.xcconfig, so no
        # manual signing setup is needed after regenerating the project.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(inherited)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LeafPDF
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        # Cloud Backing talks to the user's WebDAV server.
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
        # The core is built for Apple silicon only (see docs/adr/0006).
        ARCHS: arm64
        # PDFKit's iOS 26 form-field analysis (`PDFPageAnalyzerV2`) violates
        # MainActor isolation itself and crashes the app through its own
        # runtime checks (Apple FB22409977). Enforcement is decided by the
        # main executable, so turning it off here also silences PDFKit's
        # checks until Apple ships a fix.
        OTHER_SWIFT_FLAGS: "$(inherited) -disable-dynamic-actor-isolation"
        # Ad-hoc sign macOS builds so they run without a development team.
        # Revisit once macOS needs capabilities such as CloudKit.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
    scheme:
      testTargets: [LeafPDFTests]
  LeafPDFTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [LeafPDFTests]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: LeafPDF
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(inherited)
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        # macOS app bundles keep the executable under Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/LeafPDF.app/Contents/MacOS/LeafPDF"
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"
