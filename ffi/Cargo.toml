[package]
name = "leaf-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Linked into the Apple XCFramework. Add "cdylib" once Android needs it.
crate-type = ["staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# What the bindings generator needs; the shipped library has neither.
cli = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
leaf-core = { path = "../core" }
uniffi = { version = "0.32", default-features = false }
