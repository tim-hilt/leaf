[package]
name = "leafpdf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
automerge = "0.12.0"
# Already in the tree through ureq and automerge: Basic auth and hex.
base64 = "0.23"
hex = "0.4"
# Inflate only: reads the zip of an EPUB. Already in the tree through flate2.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
quick-xml = "0.42.0"
# Answers of the OAuth and Drive APIs. Already in the tree through uniffi.
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1.26"

# TLS: the system's on Apple (ADR-0023), rustls elsewhere until a platform picks its own.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
ureq = { version = "3.4", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }
