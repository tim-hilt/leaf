[workspace]
resolver = "3"
members = ["core", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# The core ships inside the app: optimise for size.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
# A panic is a bug: crash instead of shipping unwind tables.
panic = "abort"

# Optimised dependencies (Automerge) keep the debug test run fast.
[profile.dev.package."*"]
opt-level = 3
