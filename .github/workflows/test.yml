name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      # Match the local Xcode; the image defaults to 27.0.
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      # rustup installs the toolchain and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make lint
      - run: make test
  apple:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      # Match the local Xcode; the image defaults to 27.0.
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: brew install xcodegen
      # rustup installs the toolchain and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make apple-test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: leaf-test-log
          path: /tmp/leaf-test.log
