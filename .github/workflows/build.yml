name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      # Match the local Xcode; the image defaults to 27.0.
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: brew install xcodegen
      # rustup installs the toolchain and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Builds the core for every Apple target, then the app for macOS and the iOS Simulator.
      - run: make apple apple-build
